<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>房貸試算 | ISHIMA</title>

    <!--Bootstrap Icon-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!--Google icon-->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <!--Swiper輪播-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
  </head>
  <body>
    <%- include('./layout/header'); -%>
    <main>
      <!--標題、背景-->
      <section class="position-relative">
        <!--手機版-->
        <div class="px-5 d-lg-none">
          <img
            src="../assets/images/detail-Image-3.png"
            alt=""
            class="calculate-m-bg rounded-5 mt-4 mb-5"
          />
        </div>

        <!--背景-->
        <div class="calculate mx-5 rounded-5 m-lg-10 rounded-lg-6"></div>
      </section>

      <section class="pt-17 pb-19">
        <div class="container">
          <!--流程-->
          <div class="stepper mb-15">
            <div class="step is-active">
              <div class="step__circle">1</div>
              <div class="step__label">了解流程</div>
            </div>
            <div class="step is-active">
              <div class="step__circle">2</div>
              <div class="step__label">填寫資料</div>
            </div>
            <div class="step">
              <div class="step__circle">3</div>
              <div class="step__label">選擇時間</div>
            </div>
          </div>

          <!--返回前頁-->
          <div class="d-flex gap-2 mb-10">
            <button
              type="button"
              class="btn btn-primary bg-transparent fw-bold text-primary-dark border-0 align-items-center d-flex"
            >
              <span class="material-symbols-outlined p-1 text-black">
                arrow_back </span
              >返回房源
            </button>
          </div>
          <!--手機版顯示-->
          <div class="bg-white rounded-6 d-lg-none py-7 px-6 mb-7">
            <a href="#">
              <div class="px-2">
                <div class="mb-4">
                  <h5 class="fs-5-m fs-lg-5 text-dark mb-1">現代豪華公寓</h5>
                  <div class="d-flex align-items-center">
                    <span class="material-symbols-outlined fs-6-m fs-lg-6">
                      location_on
                    </span>
                    <p class="fs-sm lh-lg">台北市信義區</p>
                  </div>
                </div>
                <div class="d-flex align-items-center mb-7">
                  <h5 class="fs-lg-5 fs-5-m me-4 lh-lg">NT$</h5>
                  <h3 class="fs-lg-3 fs-3-m me-4 lh-base text-primary-dark">
                    1,500
                  </h3>
                  <h5 class="fs-lg-5 fs-5-m lh-lg">萬</h5>
                </div>
                <div class="d-flex flex-lg-wrap gap-2">
                  <div
                    class="d-flex align-items-center border border-primary rounded-pill py-2 px-6 me-2"
                  >
                    <span
                      class="material-symbols-outlined fs-4 me-2 text-primary"
                    >
                      king_bed
                    </span>
                    <p class="text-primary-dark">3</p>
                  </div>
                  <div
                    class="d-flex align-items-center border border-primary rounded-pill py-2 px-6 me-2"
                  >
                    <span
                      class="material-symbols-outlined fs-4 me-2 text-primary"
                    >
                      shower
                    </span>
                    <p class="text-primary-dark">2</p>
                  </div>
                  <div
                    class="d-flex align-items-center border border-primary rounded-pill py-2 px-6 me-2 flex-shrink-0"
                  >
                    <span
                      class="material-symbols-outlined fs-4 me-2 text-primary"
                    >
                      check_box_outline_blank
                    </span>
                    <p class="text-primary-dark">45坪</p>
                  </div>
                </div>
              </div>
            </a>
          </div>
          <!--表單-->
          <div class="row g-7">
            <div class="col-lg-8">
              <div class="bg-white rounded-6 p-10">
                <h2
                  class="fs-2-m fs-lg-2 fw-bold lh-base mb-10 text-primary-dark"
                >
                  請告訴我們您的資訊
                </h2>

                <!--預約按鈕-->
                <div class="d-flex align-items-center justify-content-center">
                  <button type="button" class="btn btn-primary btn-standard">
                    下一步<span class="material-symbols-outlined ms-2">
                      arrow_right_alt
                    </span>
                  </button>
                </div>
              </div>
            </div>
            <div class="col-lg-4">
              <div class="bg-white rounded-6 d-none d-lg-block">
                <a href="#">
                  <div class="position-relative mb-5 d-none d-lg-block">
                    <img
                      src="../assets/images/search-house1.png"
                      alt=""
                      class="rounded-top-5"
                    />
                    <p
                      class="bg-neutral-0 lh-lg py-1 px-6 rounded-pill position-absolute house-badge"
                    >
                      公寓
                    </p>
                  </div>

                  <div class="px-2">
                    <div class="mb-4">
                      <h5 class="fs-5-m fs-lg-5 text-dark mb-1">
                        現代豪華公寓
                      </h5>
                      <div class="d-flex align-items-center">
                        <span class="material-symbols-outlined fs-6-m fs-lg-6">
                          location_on
                        </span>
                        <p class="fs-sm lh-lg">台北市信義區</p>
                      </div>
                    </div>
                    <div class="d-flex align-items-center mb-7">
                      <h5 class="fs-lg-5 fs-5-m me-4 lh-lg">NT$</h5>
                      <h3 class="fs-lg-3 fs-3-m me-4 lh-base text-primary-dark">
                        1,500
                      </h3>
                      <h5 class="fs-lg-5 fs-5-m lh-lg">萬</h5>
                    </div>
                    <div class="d-flex flex-lg-wrap gap-2">
                      <div
                        class="d-flex align-items-center border border-primary rounded-pill py-2 px-6 me-2"
                      >
                        <span
                          class="material-symbols-outlined fs-4 me-2 text-primary"
                        >
                          king_bed
                        </span>
                        <p class="text-primary-dark">3</p>
                      </div>
                      <div
                        class="d-flex align-items-center border border-primary rounded-pill py-2 px-6 me-2"
                      >
                        <span
                          class="material-symbols-outlined fs-4 me-2 text-primary"
                        >
                          shower
                        </span>
                        <p class="text-primary-dark">2</p>
                      </div>
                      <div
                        class="d-flex align-items-center border border-primary rounded-pill py-2 px-6 me-2 flex-shrink-0"
                      >
                        <span
                          class="material-symbols-outlined fs-4 me-2 text-primary"
                        >
                          check_box_outline_blank
                        </span>
                        <p class="text-primary-dark">45坪</p>
                      </div>
                    </div>
                  </div>
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <%- include('./layout/footer'); -%>

    <script type="module" src="../main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  </body>
</html>
