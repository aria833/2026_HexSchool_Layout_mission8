<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>房貸試算 | ISHIMA</title>

    <!--Bootstrap Icon-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!--Google icon-->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <!--Swiper輪播-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
  </head>
  <body>
    <%- include('./layout/header'); -%>

    <main>
      <section class="position-relative">
        <!--手機版-->
        <div class="px-5 d-lg-none">
          <img
            src="../assets/images/cal-Hero-Image.png"
            alt=""
            class="calculate-m-bg rounded-5 mt-4 mb-5"
          />
          <div class="p-5 mb-5">
            <h1 class="fs-1 fw-bold mb-4 text-primary-dark">房貸試算</h1>
            <p class="fs-5-m fw-bold lh-lg">
              想先算算看付得起多少？<br />購屋貸款方案，體驗即時核准
            </p>
          </div>
        </div>

        <!--標語-->
        <div class="calculate mx-5 rounded-5 m-lg-10 rounded-lg-6">
          <div class="ps-lg-10 pt-lg-20">
            <div
              class="calculate-text p-lg-10 rounded-6 calculate-bg d-none d-lg-block"
            >
              <h1 class="fw-bold fs-1-m fs-lg-1 text-primary-dark mb-6 mb-lg-7">
                房貸試算
              </h1>
              <p class="fw-bold fs-5-m fs-lg-5 lh-lg">
                上千筆精選房源、專業預約看房服務、即時房貸試算，讓您輕鬆找到理想住宅
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <%- include('./layout/footer'); -%>

    <script type="module" src="../main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  </body>
</html>
