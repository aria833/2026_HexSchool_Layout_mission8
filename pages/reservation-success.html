<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>房貸試算 | ISHIMA</title>

    <!--Bootstrap Icon-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!--Google icon-->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <!--Swiper輪播-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
  </head>
  <body>
    <%- include('./layout/header'); -%>
    <main>
      <!--標題、背景-->
      <section class="position-relative">
        <!--手機版-->
        <div class="px-5 d-lg-none">
          <img
            src="../assets/images/detail-Image-3.png"
            alt=""
            class="calculate-m-bg rounded-5 mt-4 mb-5"
          />
        </div>

        <!--背景-->
        <div class="calculate mx-5 rounded-5 m-lg-10 rounded-lg-6"></div>
      </section>

      <section class="pt-17 pb-19">
        <div class="container">
          <!--返回前頁-->
          <div class="d-flex gap-2 mb-10">
            <button
              type="button"
              class="btn btn-primary bg-transparent fw-bold text-primary-dark border-0 align-items-center d-flex"
            >
              <span class="material-symbols-outlined p-1 text-black">
                arrow_back </span
              >返回房源
            </button>
          </div>

          <!--送出表單-->
          <div class="text-center m-auto p-10 bg-white rounded-6 mx-w-966">
            <img src="../assets/images/success.png" alt="" class="mb-5" />
            <h2 class="fs-2-m fs-lg-2 fw-bold lh-base text-primary-dark mb-4">
              預約申請已送出！
            </h2>
            <p class="fw-bold fs-lg-6 fs-6-m lh-lg mb-10">
              感謝您的預約，我們的專業顧問會在 24 小時內與您聯繫確認看房時間。
            </p>
            <!--預約資訊摘要-->
            <div class="border border-primary-light rounded-2 p-7 mb-10">
              <h5 class="fw-bold fs-5-m fs-lg-5 lh-lg mb-5 text-primary">
                預約資訊摘要
              </h5>
              <div
                class="d-flex justify-content-between border-bottom border-primary-sup-light p-7"
              >
                <p class="fw-bold lh-lg">聯絡人：</p>
                <p class="text-dark">王小明</p>
              </div>
              <div
                class="d-flex justify-content-between border-bottom border-primary-sup-light p-7"
              >
                <p class="fw-bold lh-lg">Email：</p>
                <p class="text-dark">ppp@pp.pp</p>
              </div>
              <div
                class="d-flex justify-content-between border-bottom border-primary-sup-light p-7"
              >
                <p class="fw-bold lh-lg">電話：</p>
                <p class="text-dark">0987654321</p>
              </div>
              <div
                class="d-flex justify-content-between border-bottom border-primary-sup-light p-7"
              >
                <p class="fw-bold lh-lg">偏好日期：</p>
                <p class="text-dark">2026-02-25</p>
              </div>
              <div class="d-flex justify-content-between p-7">
                <p class="fw-bold lh-lg">偏好時段：</p>
                <p class="text-dark">上午 9-12點</p>
              </div>
            </div>
            <!--按鈕-->
            <div class="d-flex gap-7">
              <button
                type="button"
                class="btn btn-outline-primary btn-standard"
              >
                返回房源
              </button>
              <button type="button" class="btn btn-primary btn-standard">
                返回房源
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <%- include('./layout/footer'); -%>

    <script type="module" src="../main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  </body>
</html>
